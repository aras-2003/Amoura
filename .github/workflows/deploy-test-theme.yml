name: Deploy Shopify TEST Theme

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/playwright-ux-audit"
      - "feature/amoura-daily-club"
      - "fix/header-section-rendering-diagnostics"
    paths:
      - "assets/**"
      - "blocks/**"
      - "config/**"
      - "layout/**"
      - "locales/**"
      - "sections/**"
      - "snippets/**"
      - "templates/**"
      - "scripts/theme-push.sh"
      - ".github/workflows/deploy-test-theme.yml"
      - "tests/**"
      - "package.json"

concurrency:
  group: amoura-test-theme-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SHOPIFY_STORE: jksgiq-r4.myshopify.com
      SHOPIFY_THEME_ID: "207539044694"
      SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Theme Access token
        shell: bash
        run: |
          if [ -z "$SHOPIFY_CLI_THEME_TOKEN" ]; then
            echo "::error::Missing repository secret SHOPIFY_CLI_THEME_TOKEN"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Push current branch to MAIN TEST theme
        id: push_theme
        run: bash scripts/theme-push.sh

      - name: Install storefront audit dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Diagnose section rendering
        env:
          AMOURA_BASE_URL: https://jksgiq-r4.myshopify.com/
          SHOPIFY_STOREFRONT_PASSWORD: ${{ secrets.SHOPIFY_STOREFRONT_PASSWORD }}
        run: npm run diagnose:sections

      - name: Audit deployed TEST theme
        env:
          AMOURA_BASE_URL: https://jksgiq-r4.myshopify.com/
          SHOPIFY_STOREFRONT_PASSWORD: ${{ secrets.SHOPIFY_STOREFRONT_PASSWORD }}
          MAX_AUDIT_ROUTES: "30"
        run: npm run audit

      - name: Upload deployed theme audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amoura-deployed-test-${{ github.sha }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14
