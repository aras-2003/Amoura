name: Deploy Shopify TEST Theme

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - "assets/**"
      - "blocks/**"
      - "config/**"
      - "layout/**"
      - "locales/**"
      - "sections/**"
      - "snippets/**"
      - "templates/**"
      - "scripts/theme-push.sh"
      - "scripts/write-deploy-proof.sh"
      - "scripts/build-astra-evidence.sh"
      - "scripts/theme-pull.sh"
      - "docs/**"
      - "AGENTS.md"
      - ".github/workflows/deploy-test-theme.yml"
      - "tests/**"
      - "package.json"

concurrency:
  group: amoura-test-theme-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SHOPIFY_STORE: jksgiq-r4.myshopify.com
      SHOPIFY_THEME_ID: "207539044694"
      SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Theme Access token
        shell: bash
        run: |
          if [ -z "$SHOPIFY_CLI_THEME_TOKEN" ]; then
            echo "::error::Missing repository secret SHOPIFY_CLI_THEME_TOKEN"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Push current branch to MAIN TEST theme
        id: push_theme
        run: bash scripts/theme-push.sh

      - name: Install storefront audit dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify backlog Definition of Done
        env:
          AMOURA_BASE_URL: https://jksgiq-r4.myshopify.com/
          SHOPIFY_STOREFRONT_PASSWORD: ${{ secrets.SHOPIFY_STOREFRONT_PASSWORD }}
          MAX_AUDIT_ROUTES: "30"
        run: npm run qa:dod

      - name: Build Astra review evidence
        if: success()
        run: bash scripts/build-astra-evidence.sh

      - name: Upload lightweight QA reports
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: amoura-qa-reports-${{ github.sha }}
          path: |
            reports/astra/**
            reports/ux/**/report.json
            reports/screenshots/**/home-full.png
            reports/screenshots/**/club-full.png
            reports/screenshots/**/collection-full.png
            reports/screenshots/**/product-full.png
            reports/screenshots/**/article-full.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: amoura-qa-failure-${{ github.sha }}
          path: |
            reports/
            test-results/
          if-no-files-found: warn
          retention-days: 7
