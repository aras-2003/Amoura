name: Manual Amoura UX Audit

on:
  workflow_dispatch:

concurrency:
  group: amoura-manual-ux-audit
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AMOURA_BASE_URL: https://jksgiq-r4.myshopify.com/
      SHOPIFY_STOREFRONT_PASSWORD: ${{ secrets.SHOPIFY_STOREFRONT_PASSWORD }}
      MAX_AUDIT_ROUTES: "30"

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Validate required secret
        shell: bash
        run: |
          if [ -z "$SHOPIFY_STOREFRONT_PASSWORD" ]; then
            echo "::error::Missing repository secret SHOPIFY_STOREFRONT_PASSWORD"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run rendered UX audit
        run: npm run audit

      - name: Upload UX reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: amoura-manual-ux-audit-${{ github.run_number }}
          path: |
            reports/
            test-results/
          if-no-files-found: warn
          retention-days: 7
