name: Manual Shopify TEST Theme Snapshot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull-theme:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    env:
      SHOPIFY_STORE: jksgiq-r4.myshopify.com
      SHOPIFY_THEME_ID: "207539044694"
      SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Validate Theme Access token
        shell: bash
        run: |
          if [ -z "$SHOPIFY_CLI_THEME_TOKEN" ]; then
            echo "::error::Missing repository secret SHOPIFY_CLI_THEME_TOKEN"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Pull approved TEST theme snapshot
        run: bash scripts/theme-pull.sh

      - name: Commit snapshot only if Shopify differs
        shell: bash
        run: |
          git config user.name "amoura-theme-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets blocks config layout locales sections snippets templates
          if git diff --cached --quiet; then
            echo "Theme already matches repository snapshot."
            exit 0
          fi
          git commit -m "Sync approved Shopify TEST theme snapshot"
          git push origin HEAD:main
